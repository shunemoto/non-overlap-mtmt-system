# カメラごとの観測区間と遷移領域の定義。
#
# 座標はすべて元画像の画素座標（左上原点、y は下向き）。
# 角度は度で、右向きを 0 度、下向きを 90 度とする
# （cv2 の y 軸は下向きなので atan2(dy, dx) を度にした値そのまま）。
# [290, 60] のように 0 をまたぐ区間を書いてよい。
#
# exclude_regions / transition_zones / homography はいずれも省略できる。
# 定義の途中でも読み込みが通るので、書いては viz-region で確認する、を
# 繰り返せる。
#
#   python -m mct.cli viz-region --date 0720 --camera camA
#
# region の型:
#   type: rect     points は [左上, 右下] の2点
#   type: polygon  points は3点以上の頂点列

