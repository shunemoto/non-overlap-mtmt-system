# カメラ定義テンプレート
#
# 撮影日ごとに、その日に使用した8台のカメラを列挙する。
# date は "0720" のような4桁、camera は "camA" のようなカメラID。
#
# 記法:
#
# cameras:
#   "0720":
#     camA:
#       video: "data/0720/camA.mp4"   # 入力動画のパス（リポジトリルートからの相対）
#       width: 1920                   # フレーム幅 [px]
#       height: 1080                  # フレーム高 [px]
#       fps: 30.0                     # フレームレート
#       note: ""                      # 設置位置などの自由記述（任意）
#     camB:
#       video: ""
#       width:
#       height:
#       fps:
#       note: ""

cameras: {}
