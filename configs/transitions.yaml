# カメラ間の移動時間テンプレート
#
# 視野が重複しないため、あるカメラから消えた人物が次のカメラに現れるまでには
# 必ず空白時間がある。その下限・上限をカメラ対ごとに秒で与え、再同定の
# 候補を時間的に絞り込むために使う。
#
# 記法:
#
# transitions:
#   camA:
#     camB:
#       min_sec: 4.0      # 最短でこれだけかかる（これより早い出現は別人）
#       max_sec: 25.0     # これを超えたら同一人物とみなさない
#     camC:
#       min_sec:
#       max_sec:
#
# 方向は非対称（camA→camB と camB→camA は別エントリ）。
# 直接行き来できないカメラ対は記載しない。

transitions: {}
