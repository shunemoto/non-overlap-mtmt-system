# カメラ間の移動時間テンプレート
#
# 視野が重複しないため、あるカメラから消えた人物が次のカメラに現れるまでには
# 必ず空白時間がある。その下限・上限をカメラ対ごとに秒で与え、再同定の
# 候補を時間的に絞り込むために使う。
#
# 記法:
#
# transitions:
#   camA:
#     camB:
#       min_sec: 4.0      # 最短でこれだけかかる（これより早い出現は別人）
#       max_sec: 25.0     # これを超えたら同一人物とみなさない
#     camC:
#       min_sec:
#       max_sec:
#
# 方向は非対称（camA→camB と camB→camA は別エントリ）。
# 直接行き来できないカメラ対は記載しない。

transitions:

  - from: {cam: camA, zone: a_to_b}
    to: {cam: camA, zone: a_to_b} # 自己ループ
    distance_m: 30.0 # 居室までの往復距離
    search_range_sec: [300, null] # 上限なし
    c_dwell: 0.1
  - from: {cam: camA, zone: a_to_b}
    to: {cam: camB, zone: b_to_a}
    distance_m: 41.0
    search_range_sec: [27, 37]
    c_dwell: 0.2  # 探索時間範囲外の固定値
  - from: {cam: camA, zone: a_to_h}
    to: {cam: camH, zone: h_to_a}
    distance_m: 15.0
    search_range_sec: [7, 16]
    c_dwell: 0.1
  - from: {cam: camB, zone: b_to_a}
    to: {cam: camA, zone: a_to_b}
    distance_m: 41.0
    search_range_sec: [27, 37]
    c_dwell: 0.2
  - from: {cam: camB, zone: b_to_a}
    to: {cam: camB, zone: b_to_a} # 自己ループ
    distance_m: 20.0 # 居室までの往復距離
    search_range_sec: [200, null] # 上限なし
    c_dwell: 0.2
  - from: {cam: camB, zone: b_to_cf}
    to: {cam: camC, zone: c_to_bdef}
    distance_m: 20.0
    search_range_sec: [13, 28]
    c_dwell: 0.15
  - from: {cam: camB, zone: b_to_d}
    to: {cam: camD, zone: d_to_bcf}
    distance_m: 9.0
    search_range_sec: [6, 16]
    c_dwell: 0.1
  - from: {cam: camB, zone: b_to_cf}
    to: {cam: camF, zone: f_to_bcd}
    distance_m: 18.0
    search_range_sec: [11, 26]
    c_dwell: 0.15
  - from: {cam: camC, zone: c_to_bdef}
    to: {cam: camB, zone: b_to_cf}
    distance_m: 20.0
    search_range_sec: [13, 28]
    c_dwell: 0.15
  - from: {cam: camC, zone: c_to_bdef}
    to: {cam: camD, zone: d_to_bcf}
    distance_m: 21.0
    search_range_sec: [13, 28]
    c_dwell: 0.15
  - from: {cam: camC, zone: c_to_bdef}
    to: {cam: camD, zone: d_to_c}
    distance_m: 21.0
    search_range_sec: [13, 28]
    c_dwell: 0.1
  - from: {cam: camC, zone: c_to_bdef}
    to: {cam: camE, zone: e_to_c}
    distance_m: 20.0
    search_range_sec: [15, 25]
    c_dwell: 0.1
  - from: {cam: camC, zone: c_to_e}
