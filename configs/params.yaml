tracking:
  # --- モデル ---
  # M1 の MPS で yolo11x-pose は 7.4 fps、yolo11l-pose は 14.6 fps。
  # 32本を現実的な時間（約10.7時間）で回すため l を既定とする。
  # 精度優先なら "yolo11x-pose.pt" に変更する（32本で約18.3時間）。
  model_pose: "yolo11l-pose.pt"
  model_seg: "yolo11x-seg.pt"
  tracker: "botsort.yaml"
  conf_threshold: 0.25

  # --- 保存フレームの選抜 ---
  n_saved_per_track: 90
  n_bins: 9 # トラックを時間で n_bins 等分し各区画から選ぶ
  crop_padding_ratio: 0.10 # crop は bbox を四方にこの割合だけ広げて切り出す
  jpeg_quality: 95

  # --- 推論 ---
  device: "mps" # Apple Silicon。CUDA 機なら "cuda"、無ければ "cpu"
  imgsz: 640
  stride: 1 # N フレームに1枚だけ推論（1 = 全フレーム）
  mask_iou_threshold: 0.30 # これ未満の IoU しか無ければマスク無しとする

# --- フェーズ2（今回使う） ---
filtering:
  min_track_len: 31
  n_frames_per_track: 30
  static_max_distance_m: 1.0
  static_min_len: 60
  static_max_std_m: 0.3
  static_max_conf: 0.7
  static_max_distance_px: 80
  static_max_std_px: 25
  dir_frames: 30 # 進行方向の算出に使うフレーム数

# --- フェーズ4以降（未使用。値は暫定） ---
spatiotemporal:
  fps: 30
  speed_target_sec: 1.5 # 速度計測の目標刻み（秒）。短くすると1区間の誤差が増える
  speed_min_segments: 3 # 最低でもこの数の区間に分割する
  speed_stop_threshold: 0.3 # これ未満の区間は停止とみなして中央値から外す
  speed_min_mps: 0.6 # 算出後にこの範囲へクリップする（ホモグラフィの外挿誤差対策）
  speed_max_mps: 2.0
  self_loop_dir_tol: 60 # 自己ループで進行方向の反転を認める許容差（度）
  calib_min_samples: 5 # 距離校正でこの数未満のゾーン対は手動値を維持する
  sigma_min_samples: 5 # σ もこの数未満のゾーン対は共通値を使う
  sigma_default_frames: 60 # 共通σの初期値（calibrate-sigma で上書きされる）
  # dir_frames は filtering 側の値を使う（遷移領域の判定と食い違わせないため）

# --- フェーズ5: 外観類似度 ---
appearance:
  # 掃引（app-sweep）で AUC が最大になった組み合わせ。ビンを細かくすると、
  # 同じ服でも撮影ごとに色相が数度ずれて別のビンに落ちるため下がる。
  hist_bins: [8, 8] # H×S の格子。無彩色ビン1つを足して 65 次元
  achromatic_threshold: 0.10 # 彩度がこれ未満の画素は色相を使わず無彩色ビンへ
  # 0.09 が頂点。これ以上広げるとカメラ間で尺度と視点の差を拾って下がる
  # （同一カメラ内の自己ループだけは広いほど上がる）。
  sift_patch_ratio: 0.09 # 記述半径 r = 0.09 * bbox 高
  sift_patch_size: 32 # r によらずこの大きさへ揃えてから記述する
  sift_min_frames: 5 # 有効フレームがこれ未満の関節点は使わない
  lambda_missing: 0.9 # 根拠が片方しか無い候補に掛ける係数

# --- フェーズ6: スコアの融合と ID 統合 ---
fusion:
  alpha: 0.5 # 時空間の重み（幾何平均の指数）
  # 自己ループの時空間尤度は c_dwell 固定で順位付けの機能を持たない
  # （AUC 0.30）のに対し、外観は同一カメラ内なので AUC 0.97 と高い。
  alpha_self: 0.1 # 自己ループ時の時空間の重み
  no_match_score: 0.10 # 未対応のスコア

# --- GT からの特徴抽出（gt-features / outputs_gt）---
# ここに書いたキーだけが tracking: の値を上書きする。予測側（outputs）には
# 影響しない。
#
# GT の bbox は人物の輪郭より広めに取られており、seg のマスクは輪郭に密着
# するため IoU が構造的に下がる。閾値 0.30 ではマスク欠損 131 件のうち 96 件
# が「seg は人物を正しく検出しているのに採用されない」ものだった。
gt_features:
  mask_iou_threshold: 0.15

# --- 評価（GT との突き合わせ） ---
evaluation:
  iou_threshold: 0.5    # 共存フレームでこれ以上なら「重なった」とみなす
  match_min_ratio: 0.3  # 重なりが GT トラック長のこの割合未満なら対応なし

# --- GT のフレーム基準の補正 ---
# アノテーション時の基準が追跡結果とずれているカメラ・日付だけを書く。
# 値は「GT が追跡結果より何フレーム進んでいるか」。gt.txt は書き換えない。
# 0730/camC はオフセット0で IoU>=0.5 が 11.8% しかなく、+10 で 93.4% になる
# （他のカメラ・日付はオフセット0が最良）。
gt_frame_offset:
  "0730":
    camC: 10
