# 正解遷移から距離を校正した transitions。
# scripts ではなく `python -m mct.cli calibrate-distance` が生成する。
# distance_m 以外は configs/transitions.yaml と同じ。
# adopted=False のゾーン対（サンプル数が足りない）は手動値のまま。

