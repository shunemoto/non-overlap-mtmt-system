[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mct"
version = "0.1.0"
description = "非重複視野マルチカメラ人物追跡・再同定システム"
requires-python = ">=3.11"
dependencies = [
    "ultralytics",
    "lapx",          # BoT-SORT / ByteTrack の割り当て問題を解く
    "opencv-python",
    "numpy",
    "pyyaml",
    "tqdm",
    "scipy",
]

# torch はここに含めない。プラットフォームに合ったビルドを別途入れる
# （README の「セットアップ」を参照）。Apple Silicon では既定のホイールが
# そのまま MPS に対応する。

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mct = "mct.cli:main"

[tool.setuptools]
packages = ["mct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
